<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gradient Hero Banner</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <p class="eyebrow">CSS Colors and Backgrounds</p>
        <h1 class="hero__title">Build a Gradient Hero</h1>
        <p class="hero__desc">
          Your goal: create a gradient background and make text readable on top.
        </p>
        <div class="actions">
          <a href="#" class="btn btn--primary">Get Started</a>
          <a href="#" class="btn btn--ghost">Learn More</a>
        </div>
      </header>

      <section class="panel">
        <h2 class="panel__title">Contrast Check</h2>
        <p class="panel__text">
          If you can't read the text easily, the color choice needs adjusting.
        </p>
      </section>
    </main>
  </body>
</html>
