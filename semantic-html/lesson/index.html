<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Semantic HTML</title>
  </head>
  <body>
    <!-- header defines the top section of a webpage -->
    <header>
      <h1>My Website</h1>
      <!-- nav contains the navigation menu with links to other pages/sections -->
      <nav>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">Blog</a></li>
          <li><a href="mailto:123abc@gmail.com">Contact</a></li>
          <!-- anchor tag going to an external link -->
          <li><a href="https://google.com" target="_blank">Google.com</a></li>
        </ul>
      </nav>
    </header>
    <!-- main contains the primary content that is unique to each page -->
    <main>
      <!-- section groups related content within the page -->
      <section>
        <h2>About Us</h2>
        <p>We build websites using clean HTML and CSS</p>
      </section>
      <!-- article is used for self-contained content such as blog posts -->
      <article>
        <h2>Latest Blog Post</h2>
        <p>Understanding the importance of semantic HTML.</p>
      </article>
      <!-- aside represents sidebar content such as advertisements or related links -->
      <aside>
        <h3>Sidebar</h3>
        <p>Links to useful resources</p>
      </aside>
    </main>
    <!-- footer contains copyright notices and extra information -->
    <footer>
      <p>&copy; 2026 My Website</p>
    </footer>
  </body>
</html>
