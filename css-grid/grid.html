<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid</title>
    <style>
      .grid-container {
        display: grid;
        background-color: lightgray;
        padding: 10px;
        gap: 1rem;
        grid-template-columns: repeat(3, 1fr);
        /* justify-items: start; horizontal alignment w/in each cell*/
        /* align-items: center; vertical alignment w/in each cell*/
        place-items: center normal; 
      }

      .item {
        background-color: steelblue;
        color: white;
        padding: 20px;
      }

      .item:first-child {
        grid-column: span 2;
        grid-row: span 2;
      }
    </style>
  </head>
  <body>
    <div class="grid-container">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
    </div>
  </body>
</html>
